spring.config.import: "${WALLET_COMMON_CONFIG:classpath:common.yaml}"
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include: readinessState,mongo
spring.profiles.default: "${SPRING_PROFILES_DEFAULT:develop}"
server:
  port: "${SERVER_PORT:8090}"
spring.kafka.producer:
  acks: all
  key-serializer: org.apache.kafka.common.serialization.StringSerializer
  value-serializer: org.apache.kafka.common.serialization.StringSerializer
  properties:
    enable.idempotence: true
    max.block.ms: ${WALLET_KAFKA_MAX_BLOCK_MS:5000}
    delivery.timeout.ms: ${WALLET_KAFKA_DELIVERY_TIMEOUT_MS:15000}
    request.timeout.ms: ${WALLET_KAFKA_REQUEST_TIMEOUT_MS:10000}
wallet:
  audit:
    enabled: ${WALLET_AUDIT_ENABLED:false}
    interval: ${WALLET_AUDIT_INTERVAL:10s}
    lease: ${WALLET_AUDIT_LEASE:1m}
    timeout: ${WALLET_AUDIT_TIMEOUT:40s}
    batch-size: ${WALLET_AUDIT_BATCH_SIZE:25}
    topic: ${WALLET_AUDIT_TOPIC:wallet.audit.alerts.v1}
  top-up:
    http:
      enabled: false
  outbox:
    enabled: ${WALLET_OUTBOX_ENABLED:false}
    interval: ${WALLET_OUTBOX_INTERVAL:2s}
    topic: ${WALLET_OUTBOX_TOPIC:wallet.events.v1}
    claim-lease: ${WALLET_OUTBOX_CLAIM_LEASE:45s}
    send-timeout: ${WALLET_OUTBOX_SEND_TIMEOUT:20s}
    batch-size: ${WALLET_OUTBOX_BATCH_SIZE:25}
  reconciliation:
    enabled: ${WALLET_RECONCILIATION_ENABLED:false}
    interval: ${WALLET_RECONCILIATION_INTERVAL:15s}
    lease: ${WALLET_RECONCILIATION_LEASE:1m}
    run-timeout: ${WALLET_RECONCILIATION_RUN_TIMEOUT:25s}
    stale-pending-age: ${WALLET_RECONCILIATION_STALE_PENDING_AGE:2m}
    receipt-delay: ${WALLET_RECONCILIATION_RECEIPT_DELAY:15s}
    batch-size: ${WALLET_RECONCILIATION_BATCH_SIZE:25}
  payment-providers:
    stripe:
      top-up-enabled: ${WALLET_PAYMENT_PROVIDERS_STRIPE_TOP_UP_ENABLED:true}
      connect-timeout: ${WALLET_PAYMENT_PROVIDERS_STRIPE_CONNECT_TIMEOUT:2s}
      request-timeout: ${WALLET_PAYMENT_PROVIDERS_STRIPE_REQUEST_TIMEOUT:5s}
    paypal:
      orders-uri: "${WALLET_PAYMENT_PROVIDERS_PAYPAL_ORDERS_URI:${WALLET_SIMULATOR_PAYPAL_ORDERS_URI:http://127.0.0.1:9999/v1/paypal-simulator/v2/checkout/orders}}"
      connect-timeout: ${WALLET_PAYMENT_PROVIDERS_PAYPAL_CONNECT_TIMEOUT:${WALLET_SIMULATOR_CONNECT_TIMEOUT:2s}}
      request-timeout: ${WALLET_PAYMENT_PROVIDERS_PAYPAL_REQUEST_TIMEOUT:${WALLET_SIMULATOR_REQUEST_TIMEOUT:5s}}
    redsys:
      authorization-uri: "${WALLET_PAYMENT_PROVIDERS_REDSYS_AUTHORIZATION_URI:${WALLET_SIMULATOR_REDSYS_AUTHORIZATION_URI:http://127.0.0.1:9999/v1/redsys-simulator/sis/rest/trataPeticion}}"
      connect-timeout: ${WALLET_PAYMENT_PROVIDERS_REDSYS_CONNECT_TIMEOUT:${WALLET_SIMULATOR_CONNECT_TIMEOUT:2s}}
      request-timeout: ${WALLET_PAYMENT_PROVIDERS_REDSYS_REQUEST_TIMEOUT:${WALLET_SIMULATOR_REQUEST_TIMEOUT:5s}}
---
spring.config.activate.on-profile: "${WALLET_DEVELOP_PROFILE:develop}"
spring.mongodb.uri: "${SPRING_MONGODB_URI:mongodb://localhost:27017/playtomic?directConnection=true&replicaSet=wallet-rs&w=majority}"
wallet:
  payment-providers:
    stripe:
      charges-uri: "${WALLET_PAYMENT_PROVIDERS_STRIPE_CHARGES_URI:${STRIPE_SIMULATOR_CHARGESURI:https://sandbox.playtomic.io/v1/stripe-simulator/charges}}"
      refunds-uri: "${WALLET_PAYMENT_PROVIDERS_STRIPE_REFUNDS_URI:${STRIPE_SIMULATOR_REFUNDSURI:https://sandbox.playtomic.io/v1/stripe-simulator/payments/{payment_id}/refunds}}"
---
spring.config.activate.on-profile: "${WALLET_TEST_PROFILE:test}"
wallet:
  payment-providers:
    stripe:
      charges-uri: "${WALLET_PAYMENT_PROVIDERS_STRIPE_CHARGES_URI:${STRIPE_SIMULATOR_CHARGESURI:http://localhost:9999}}"
      refunds-uri: "${WALLET_PAYMENT_PROVIDERS_STRIPE_REFUNDS_URI:${STRIPE_SIMULATOR_REFUNDSURI:http://localhost:9999/payments/{payment_id}/refunds}}"
---
spring.config.activate.on-profile: local-top-up
server.address: 127.0.0.1
spring.mongodb.uri: "${SPRING_MONGODB_URI:mongodb://localhost:27017/playtomic?directConnection=true&replicaSet=wallet-rs&w=majority}"
wallet:
  top-up:
    http:
      enabled: true
      synthetic-card-number: "4242424242424242"
  payment-providers:
    stripe:
      charges-uri: "${WALLET_PAYMENT_PROVIDERS_STRIPE_CHARGES_URI:http://127.0.0.1:9999/v1/stripe-simulator/charges}"
      local-top-up-allowed-charge-uri: "http://127.0.0.1:9999/v1/stripe-simulator/charges"
      refunds-uri: "http://127.0.0.1:9999/v1/stripe-simulator/payments/{payment_id}/refunds"
