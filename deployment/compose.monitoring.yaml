# Local monitoring only. Combine with compose.yaml; see docs/local-monitoring.md.
x-management: &management
  MANAGEMENT_SERVER_PORT: '9091'
  MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
services:
  wallet:
    environment: *management
  simulator:
    environment: *management
  prometheus:
    image: prom/prometheus:v3.14.0
    pull_policy: never
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:13.0.7
    pull_policy: never
    ports: ['127.0.0.1:${GRAFANA_HTTP_PORT:-3000}:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a local Grafana admin password}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    pull_policy: never
    depends_on:
      mongo-init: {condition: service_completed_successfully}
    ports: ['127.0.0.1:${MONGO_EXPRESS_HTTP_PORT:-8081}:8081']
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/playtomic?replicaSet=wallet-rs
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'false'
      ME_CONFIG_OPTIONS_READONLY: 'true'
      ME_CONFIG_BASICAUTH: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: monitor
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?set a local Mongo Express password}
volumes:
  prometheus-data:
  grafana-data:
