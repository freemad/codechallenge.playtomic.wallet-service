x-mongo: &mongo
  image: &mongo-image mongo:8.3.17-noble
  command: ["--replSet", "wallet-rs", "--bind_ip_all"]
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
    interval: ${MONGO_HEALTH_INTERVAL:-3s}
    timeout: ${MONGO_HEALTH_TIMEOUT:-5s}
    retries: ${MONGO_HEALTH_RETRIES:-20}

services:
  mongo-1:
    <<: *mongo
    volumes:
      - mongo-1-data:/data/db

  mongo-2:
    <<: *mongo
    volumes:
      - mongo-2-data:/data/db

  mongo-3:
    <<: *mongo
    volumes:
      - mongo-3-data:/data/db

  mongo-init:
    image: *mongo-image
    depends_on: [mongo-1, mongo-2, mongo-3]
    volumes:
      - ./init-replica-set.js:/init-replica-set.js:ro
    command: ["mongosh", "--quiet", "--nodb", "--file", "/init-replica-set.js"]

  simulator:
    build:
      context: ..
      dockerfile: deployment/simulator.Dockerfile
    environment:
      - SERVER_ADDRESS=0.0.0.0
      - PAYMENT_SIMULATOR_SCENARIO=${PAYMENT_SIMULATOR_SCENARIO:-SUCCESS}

  wallet:
    build:
      context: ..
      dockerfile: deployment/wallet.Dockerfile
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      simulator:
        condition: service_started
    environment:
      - SPRING_MONGODB_URI=${SPRING_MONGODB_URI:-mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/playtomic?replicaSet=wallet-rs&w=majority}
      - WALLET_PAYMENT_PROVIDERS_STRIPE_CHARGES_URI=${WALLET_PAYMENT_PROVIDERS_STRIPE_CHARGES_URI:-${STRIPE_SIMULATOR_CHARGESURI:-http://simulator:9999/v1/stripe-simulator/charges}}
      - WALLET_PAYMENT_PROVIDERS_STRIPE_REFUNDS_URI=${WALLET_PAYMENT_PROVIDERS_STRIPE_REFUNDS_URI:-${STRIPE_SIMULATOR_REFUNDSURI:-http://simulator:9999/v1/stripe-simulator/payments/{payment_id}/refunds}}
      - WALLET_PAYMENT_PROVIDERS_STRIPE_CONNECT_TIMEOUT=${WALLET_PAYMENT_PROVIDERS_STRIPE_CONNECT_TIMEOUT:-2s}
      - WALLET_PAYMENT_PROVIDERS_STRIPE_REQUEST_TIMEOUT=${WALLET_PAYMENT_PROVIDERS_STRIPE_REQUEST_TIMEOUT:-5s}
      - WALLET_PAYMENT_PROVIDERS_PAYPAL_ORDERS_URI=${WALLET_PAYMENT_PROVIDERS_PAYPAL_ORDERS_URI:-${WALLET_SIMULATOR_PAYPAL_ORDERS_URI:-http://simulator:9999/v1/paypal-simulator/v2/checkout/orders}}
      - WALLET_PAYMENT_PROVIDERS_PAYPAL_CONNECT_TIMEOUT=${WALLET_PAYMENT_PROVIDERS_PAYPAL_CONNECT_TIMEOUT:-${WALLET_SIMULATOR_CONNECT_TIMEOUT:-2s}}
      - WALLET_PAYMENT_PROVIDERS_PAYPAL_REQUEST_TIMEOUT=${WALLET_PAYMENT_PROVIDERS_PAYPAL_REQUEST_TIMEOUT:-${WALLET_SIMULATOR_REQUEST_TIMEOUT:-5s}}
      - WALLET_PAYMENT_PROVIDERS_REDSYS_AUTHORIZATION_URI=${WALLET_PAYMENT_PROVIDERS_REDSYS_AUTHORIZATION_URI:-${WALLET_SIMULATOR_REDSYS_AUTHORIZATION_URI:-http://simulator:9999/v1/redsys-simulator/sis/rest/trataPeticion}}
      - WALLET_PAYMENT_PROVIDERS_REDSYS_CONNECT_TIMEOUT=${WALLET_PAYMENT_PROVIDERS_REDSYS_CONNECT_TIMEOUT:-${WALLET_SIMULATOR_CONNECT_TIMEOUT:-2s}}
      - WALLET_PAYMENT_PROVIDERS_REDSYS_REQUEST_TIMEOUT=${WALLET_PAYMENT_PROVIDERS_REDSYS_REQUEST_TIMEOUT:-${WALLET_SIMULATOR_REQUEST_TIMEOUT:-5s}}
      - WALLET_RECONCILIATION_ENABLED
      - WALLET_RECONCILIATION_INTERVAL
      - WALLET_RECONCILIATION_LEASE
      - WALLET_RECONCILIATION_RUN_TIMEOUT
      - WALLET_RECONCILIATION_STALE_PENDING_AGE
      - WALLET_RECONCILIATION_RECEIPT_DELAY
      - WALLET_RECONCILIATION_BATCH_SIZE
      - WALLET_AUDIT_ENABLED
      - WALLET_AUDIT_INTERVAL
      - WALLET_AUDIT_LEASE
      - WALLET_AUDIT_TIMEOUT
      - WALLET_AUDIT_BATCH_SIZE
      - WALLET_AUDIT_TOPIC
      - SPRING_KAFKA_BOOTSTRAP_SERVERS
      - WALLET_KAFKA_MAX_BLOCK_MS
      - WALLET_KAFKA_DELIVERY_TIMEOUT_MS
      - WALLET_KAFKA_REQUEST_TIMEOUT_MS
    ports:
      - "127.0.0.1:${WALLET_HTTP_PORT:-8090}:8090"

volumes:
  mongo-1-data:
  mongo-2-data:
  mongo-3-data: