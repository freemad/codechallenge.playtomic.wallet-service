<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">When Stripe accepts but the reply is lost</title>
  <desc id="desc">The wallet sends one €5.25 charge. The local Stripe fixture saves its acceptance but the reply never reaches the wallet. The balance stays at €10 in review. Reconciliation looks up the saved provider reference, verifies the amount and currency, and records the receipt. The wallet credits once to €15.25.</desc>
  <style>
    text { fill: #f8fafc; font: 16px system-ui, sans-serif }
    .heading { font-size: 27px; font-weight: 700 }
    .actor { fill: #a5f3df; font-size: 19px; font-weight: 650 }
    .lane { stroke: #557385; stroke-dasharray: 3 5 }
    .message { stroke: #71e6c5; stroke-width: 3; fill: none; marker-end: url(#arrow) }
    .lost { stroke: #fbbf72; stroke-width: 3; stroke-dasharray: 6 5 }
    @media (prefers-reduced-motion: no-preference) {
      .step { animation: highlight .7s ease-out var(--delay, 0s) backwards }
      @keyframes highlight { from { opacity: .35 } to { opacity: 1 } }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path fill="#71e6c5" d="M0 0 L8 4 L0 8 Z"/></marker></defs>
  <rect width="760" height="320" rx="14" fill="#102635"/>
  <text class="heading" x="26" y="39">When Stripe accepts but the reply is lost</text>
  <g text-anchor="middle">
    <text class="actor" x="105" y="76">Wallet</text><text class="actor" x="655" y="76">Stripe fixture</text>
    <path class="lane" d="M105 84 V258 M655 84 V258"/>
    <g class="step"><text x="380" y="108">POST · charge €5.25 with a provider reference</text><path class="message" d="M105 119 H655"/></g>
    <g class="step" style="--delay:.7s"><text x="380" y="151">Stripe saves ACCEPTED; the reply is lost</text><path class="lost" d="M655 161 H200"/><path stroke="#fbbf72" stroke-width="3" d="M191 156 l10 10 m0 -10 l-10 10"/></g>
    <g class="step" style="--delay:1.4s"><text x="380" y="194">Still €10 in review · worker sends GET by reference</text><path class="message" d="M105 205 H655"/></g>
    <g class="step" style="--delay:2.1s"><text x="380" y="238">Saved decision and receipt for €5.25</text><path class="message" d="M655 249 H105"/></g>
  </g>
  <path d="M26 269 H734" stroke="#557385"/>
  <text x="26" y="299">Wallet verifies the evidence and credits once: €15.25. No second charge.</text>
</svg>